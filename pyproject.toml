[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "java-ai-code-reviewer"
version = "0.1.0"
description = "Hybrid deterministic + LLM Java code quality and risk reviewer"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "zhudun" }]
keywords = [
    "java",
    "code-review",
    "static-analysis",
    "security",
    "npe",
    "sql-injection",
    "github-action",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Security",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
jacr = "java_reviewer.cli:app"
java-ai-code-reviewer = "java_reviewer.cli:app"

[project.urls]
Homepage = "https://github.com/zhudun/java-ai-code-reviewer"
Issues = "https://github.com/zhudun/java-ai-code-reviewer/issues"

[tool.setuptools.packages.find]
include = ["java_reviewer*"]

[tool.setuptools.package-data]
java_reviewer = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
