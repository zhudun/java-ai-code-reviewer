name: Java AI Review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # This repo IS the action; no v0.1.0 tag exists yet.
      # Consumer repos should copy examples/github-action/security.yml instead.
      - uses: ./
        with:
          fail-on: HIGH
          comment-pr: "true"
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}